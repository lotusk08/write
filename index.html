<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `resizes-content` hands the keyboard to the browser where that is
         supported; where it is not, `lib/viewport.ts` measures it instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A quiet place to write, keep drafts, and publish to the blog." />
    <meta name="application-name" content="write" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />

    <!-- Installed as an app, this is a writing surface rather than a page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="write" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The blog's own marks, which swap with the system theme the way the
         site's do. -->
    <link rel="icon" type="image/svg+xml" href="/favicons/light/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/light/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/light/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicons/light/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/light/apple-touch-icon.png" />

    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
      href="/favicons/dark/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
      href="/favicons/dark/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: dark)"
      href="/favicons/dark/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      media="(prefers-color-scheme: dark)"
      href="/favicons/dark/apple-touch-icon.png"
    />

    <title>write</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
